[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperag2api"
version = "2.1.0"
description = "OpenAI-compatible, browserless local proxy server for Hyperagent.com"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hyperag2api contributors" }]
keywords = ["hyperagent", "openai", "proxy", "llm", "opencode", "mcp"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# TLS/JA3 browser impersonation. Without it the proxy falls back to plain httpx.
impersonate = ["curl_cffi>=0.7"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/heymoma/hyperag2api"

[project.scripts]
hyperag2api = "src.server:main"

[tool.setuptools]
py-modules = ["start", "proxy_server"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.adapters.api" = ["static/*.html"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
