[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperag2api"
version = "1.7.0"
description = "OpenAI-compatible local proxy server for Hyperagent.com"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hyperagent Local Proxy contributors" }]
keywords = ["hyperagent", "openai", "proxy", "llm", "opencode", "cdp"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "playwright>=1.44",
    "pydantic>=2.6",
]

[project.urls]
Homepage = "https://github.com/heymoma/hyperag2api"

[project.scripts]
hyperag2api = "start:main"

[tool.setuptools]
py-modules = ["start", "proxy_server"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
